name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/ui/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage UI for Pages
        run: |
          mkdir _site
          cp -r app/ui/* _site/
          # Tiny landing banner so visitors know desktop has more features
          cat > _site/banner.html <<'HTML'
          <!-- Banner is for reference; can be removed -->
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

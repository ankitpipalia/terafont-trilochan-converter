name: Release builds

# Triggers:
#   - Push to main: build + release IF pyproject.toml version is new (no tag exists)
#   - Push of a v* tag: always build + release using that version
#   - Manual: workflow_dispatch with optional force_release flag
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
      - "legacy/**"
      - ".gitignore"
      - ".gitattributes"
      - "LICENSE"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Release even if version is unchanged"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Decide whether this push should produce a release
  # ─────────────────────────────────────────────────────────────────
  check-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full tag history

      - id: resolve
        shell: bash
        run: |
          # 1. Determine the target version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            source="tag"
          else
            version=$(grep -E '^version = "' pyproject.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
            source="pyproject.toml"
          fi
          if [[ -z "$version" ]]; then
            echo "::error::Could not resolve version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version $version (from $source)"

          # 2. Decide whether to release
          force="${{ github.event.inputs.force_release }}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "→ tag push: will release"
            exit 0
          fi

          if [[ "$force" == "true" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "→ force_release=true: will release"
            exit 0
          fi

          # Check whether v<version> tag already exists on remote
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "→ tag v$version already exists: no new release"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "→ tag v$version is new: will release"
          fi

  # ─────────────────────────────────────────────────────────────────
  # Windows: PyInstaller + Inno Setup → installer .exe + portable .zip
  # ─────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (slim, no OCR)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-slim.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --tb=short

      - name: Build with PyInstaller
        run: pyinstaller build/pyinstaller-slim.spec --noconfirm --workpath build/_work --distpath dist

      - name: List PyInstaller output
        shell: pwsh
        run: if (Test-Path dist) { Get-ChildItem -Recurse dist | Select-Object FullName, Length }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $zipName = "dist/GujaratiConverter-windows-v${{ needs.check-version.outputs.version }}.zip"
          Compress-Archive -Path dist/GujaratiConverter/* -DestinationPath $zipName -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ needs.check-version.outputs.version }} build/installer-slim.iss

      - name: Show final artifacts
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*Setup*.exe
            dist/GujaratiConverter-windows-*.zip

  # ─────────────────────────────────────────────────────────────────
  # macOS: portable .zip (unsigned)
  # ─────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (slim)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-slim.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --tb=short

      - name: Build with PyInstaller
        run: pyinstaller build/pyinstaller-slim.spec --noconfirm --workpath build/_work --distpath dist

      - name: Package
        run: |
          cd dist
          zip -r9 "GujaratiConverter-macos-v${{ needs.check-version.outputs.version }}.zip" GujaratiConverter/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/GujaratiConverter-macos-*.zip

  # ─────────────────────────────────────────────────────────────────
  # Linux: portable tarball
  # ─────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (slim)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps for pywebview (GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libcairo2-dev pkg-config python3-dev

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-slim.txt
          pip install -r requirements-dev.txt
          pip install PyGObject pycairo || true

      - name: Run tests
        run: pytest -v --tb=short

      - name: Build with PyInstaller
        run: pyinstaller build/pyinstaller-slim.spec --noconfirm --workpath build/_work --distpath dist

      - name: Package
        run: |
          cd dist
          tar -czf "GujaratiConverter-linux-v${{ needs.check-version.outputs.version }}.tar.gz" GujaratiConverter/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/GujaratiConverter-linux-*.tar.gz

  # ─────────────────────────────────────────────────────────────────
  # Publish GitHub Release (creates the tag automatically)
  # ─────────────────────────────────────────────────────────────────
  release:
    name: Publish v${{ needs.check-version.outputs.version }}
    needs: [check-version, build-windows, build-macos, build-linux]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # If pushed to main, action-gh-release creates this tag pointing
          # at the current commit. If pushed AS a tag, it reuses the tag.
          tag_name: v${{ needs.check-version.outputs.version }}
          name: "Gujarati Converter v${{ needs.check-version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Gujarati Font Converter v${{ needs.check-version.outputs.version }}

            Convert Gujarati text between **Unicode** and **TeraFont Trilochan**, with DOCX/PDF export.

            ### Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | Windows | `GujaratiConverterSetup.exe` | Installer (recommended) |
            | Windows | `GujaratiConverter-windows-*.zip` | Portable — extract & run |
            | macOS | `GujaratiConverter-macos-*.zip` | Unsigned — see notes below |
            | Linux | `GujaratiConverter-linux-*.tar.gz` | Requires GTK 3 / WebKit2 |

            ### Install (Windows)
            1. Download `GujaratiConverterSetup.exe`
            2. Double-click → Next → Next → Finish
            3. Launch from Start Menu

            > SmartScreen may show "Windows protected your PC" the first time — click **More info → Run anyway**. The app is unsigned but runs entirely on your machine.

            ### Run (macOS)

            Because the build is unsigned, macOS Gatekeeper will block the
            embedded Python dylib with:

            > library load disallowed by system policy

            Strip the quarantine flag once, then it'll launch normally:

            ```bash
            unzip GujaratiConverter-macos-*.zip
            xattr -dr com.apple.quarantine GujaratiConverter/
            ./GujaratiConverter/GujaratiConverter
            ```

            (One-time per download. Real fix requires a paid Apple Developer
            cert for code-signing + notarization — skipped on a free project.)

            ### Run (Linux)
            ```bash
            tar -xzf GujaratiConverter-linux-*.tar.gz
            cd GujaratiConverter
            ./GujaratiConverter
            ```

            ### What's included (slim build)
            - ✅ Unicode ↔ TeraFont conversion (133 golden tests verified)
            - ✅ DOCX import + export with TeraFont applied
            - ✅ PDF export with TeraFont embedded
            - ✅ Find & Replace · Drag-drop · Keyboard shortcuts · Dark/Light themes
            - ✅ CLI mode (`GujaratiConverter --to-tera input.txt -o output.txt`)
            - ❌ OCR (image/PDF) — use the full build instead
          files: |
            artifacts/**/*

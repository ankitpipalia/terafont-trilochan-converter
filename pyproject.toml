[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gujarati-font-converter"
version = "0.1.0"
description = "Convert Gujarati text between Unicode (Shruti / Noto) and TeraFont Trilochan — with optional OCR for images and PDFs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ankit Pipalia" }]
keywords = ["gujarati", "font", "converter", "terafont", "trilochan", "unicode", "ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Gujarati",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    # Core (slim) — no OCR / PDF deps. Conversion + UI only.
    "pywebview>=5.0,<6",
]

[project.optional-dependencies]
ocr = [
    # Full build with OCR + PDF support.
    "paddleocr>=2.7,<3",
    "paddlepaddle>=2.6,<3",
    "opencv-python-headless>=4.8,<5",
    "Pillow>=10,<11",
    "PyMuPDF>=1.24,<2",
    "pytesseract>=0.3,<1",
    "numpy>=1.24,<2",
]
dev = [
    "pytest>=7.0,<9",
    "pyinstaller>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/ankit/gujarati-font-converter"
Repository = "https://github.com/ankit/gujarati-font-converter"
Issues = "https://github.com/ankit/gujarati-font-converter/issues"

[project.scripts]
gujarati-converter = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "legacy*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
